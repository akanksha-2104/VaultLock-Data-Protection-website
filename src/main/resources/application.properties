spring.application.name=vaultLock

spring.datasource.url=jdbc:mysql://localhost:3306/DataProtection_DB
spring.datasource.username=root
spring.datasource.password=tiger

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.upload-dir=uploads
app.storage.allowed-extensions=pdf,txt,csv,png,jpg,jpeg,doc,docx,xls,xlsx

server.port=8080

app.location.ipinfo-base-url=https://api.ipinfo.io/lookup
app.location.ipinfo-token=${IPINFO_TOKEN:}

app.jwt.secret=your-256-bit-secret-key-here-make-it-long-and-random-at-least-32-chars
app.jwt.expiration-ms=86400000
